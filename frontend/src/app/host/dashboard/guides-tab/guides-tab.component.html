<div class="space-y-6">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
    <div>
      <h2 class="m-0 text-2xl font-semibold text-slate-900">Guides</h2>
      <p class="m-0 mt-1 text-sm text-slate-500">Publish smart instructions, videos, and QR-linked support content for each property.</p>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row">
      <mat-form-field appearance="outline" class="min-w-[260px]">
        <mat-label>Select property</mat-label>
        <mat-select [(value)]="selectedPropertyId" (selectionChange)="loadGuides()">
          <mat-option *ngFor="let property of properties" [value]="property.id">{{ property.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button color="primary" type="button" (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Add Guide
      </button>
    </div>
  </div>

  <mat-card class="overflow-hidden rounded-3xl shadow-sm">
    <mat-card-content class="!p-0">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="min-w-full">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let guide">{{ guide.title }}</td>
          </ng-container>
          <ng-container matColumnDef="slug">
            <th mat-header-cell *matHeaderCellDef>Slug</th>
            <td mat-cell *matCellDef="let guide">{{ guide.slug }}</td>
          </ng-container>
          <ng-container matColumnDef="videoUrl">
            <th mat-header-cell *matHeaderCellDef>Video</th>
            <td mat-cell *matCellDef="let guide">{{ guide.videoUrl || '—' }}</td>
          </ng-container>
          <ng-container matColumnDef="qrCodeUrl">
            <th mat-header-cell *matHeaderCellDef>QR Code</th>
            <td mat-cell *matCellDef="let guide">
              <a *ngIf="guide.qrCodeUrl" [href]="guide.qrCodeUrl" target="_blank" rel="noreferrer" class="text-indigo-600 hover:underline">Open QR</a>
              <span *ngIf="!guide.qrCodeUrl">—</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="displayOrder">
            <th mat-header-cell *matHeaderCellDef>Order</th>
            <td mat-cell *matCellDef="let guide">{{ guide.displayOrder }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let guide">
              <div class="flex gap-2">
                <button mat-stroked-button color="primary" type="button" (click)="openDialog(guide)">Edit</button>
                <button mat-stroked-button color="warn" type="button" (click)="deleteGuide(guide)">Delete</button>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
