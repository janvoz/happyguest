<h2 mat-dialog-title>{{ data.item ? 'Edit Minibar Item' : 'Add Minibar Item' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="mt-4 grid gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price</mat-label>
      <input matInput type="number" step="0.01" formControlName="price">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stock count</mat-label>
      <input matInput type="number" formControlName="stockCount">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Image URL</mat-label>
      <input matInput formControlName="imageUrl">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Save Item</button>
</mat-dialog-actions>
