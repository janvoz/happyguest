<h2 mat-dialog-title>{{ data.guide ? 'Edit Guide' : 'Add Guide' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="mt-4 grid gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Slug</mat-label>
      <input matInput formControlName="slug">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Content (EN / Markdown)</mat-label>
      <textarea matInput rows="6" formControlName="contentMarkdown"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Content (CS / Markdown)</mat-label>
      <textarea matInput rows="6" formControlName="contentMarkdownCs"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Video URL</mat-label>
      <input matInput formControlName="videoUrl">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Display order</mat-label>
      <input matInput type="number" formControlName="displayOrder">
    </mat-form-field>

    <!-- Media Upload -->
    <div class="border-2 border-dashed border-gray-300 rounded p-4 flex flex-col items-center gap-2">
      <p class="text-sm text-gray-500">Upload images, PDFs, or videos</p>
      <label class="cursor-pointer">
        <input type="file" class="hidden" accept="image/*,.pdf,video/*" (change)="onFileSelected($event)">
        <span mat-stroked-button class="mat-stroked-button cursor-pointer px-4 py-2 border rounded">
          <mat-icon class="align-middle">cloud_upload</mat-icon> Choose file
        </span>
      </label>
      <mat-progress-bar *ngIf="uploadingMedia" mode="indeterminate"></mat-progress-bar>
      <p *ngIf="!data.guide?.id" class="text-xs text-amber-500">Save the guide first to enable media upload.</p>
    </div>

    <!-- Uploaded media list -->
    <div *ngIf="uploadedUrls.length > 0" class="grid grid-cols-3 gap-2">
      <div *ngFor="let url of uploadedUrls" class="relative group">
        <img *ngIf="!url.endsWith('.pdf')" [src]="url" class="w-full h-20 object-cover rounded" />
        <a *ngIf="url.endsWith('.pdf')" [href]="url" target="_blank" class="block p-2 bg-gray-100 rounded text-xs truncate">PDF</a>
        <button type="button" mat-icon-button class="absolute top-0 right-0 hidden group-hover:flex"
                (click)="removeMedia(url)">
          <mat-icon class="text-red-500 text-sm">close</mat-icon>
        </button>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Save Guide</button>
</mat-dialog-actions>
