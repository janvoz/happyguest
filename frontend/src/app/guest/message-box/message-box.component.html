<div class="fixed bottom-6 right-6 z-30">
  <mat-card *ngIf="expanded" class="mb-3 w-[340px] rounded-3xl shadow-2xl">
    <mat-card-header>
      <mat-card-title>Report an issue</mat-card-title>
      <mat-card-subtitle>Need help? Send a message to the host team.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Message</mat-label>
          <textarea matInput rows="5" formControlName="content"></textarea>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button type="button" (click)="expanded = false">Close</button>
      <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting" (click)="submit()">
        {{ isSubmitting ? 'Sending...' : 'Send' }}
      </button>
    </mat-card-actions>
  </mat-card>

  <button mat-fab extended color="accent" type="button" (click)="expanded = !expanded">
    <mat-icon>chat</mat-icon>
    Need help?
  </button>
</div>
