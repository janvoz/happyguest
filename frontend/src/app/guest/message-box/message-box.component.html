<div class="fixed bottom-6 right-6 z-30">
  <mat-card *ngIf="expanded" class="mb-3 w-[340px] rounded-3xl shadow-2xl">
    <mat-card-header>
      <mat-card-title>Live chat</mat-card-title>
      <mat-card-subtitle>Direct chat with your host team.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="mb-3 max-h-56 space-y-2 overflow-y-auto rounded-xl bg-slate-50 p-3 text-sm">
        <div *ngFor="let msg of messages" class="rounded-lg px-3 py-2" [class.bg-indigo-100]="msg.sender === 'GUEST'" [class.bg-white]="msg.sender === 'HOST'">
          <div class="flex items-center justify-between gap-2">
            <span class="font-medium">{{ msg.sender === 'GUEST' ? 'You' : 'Host' }}</span>
            <span class="text-[10px] text-slate-400">{{ msg.createdAt | date:'HH:mm' }}</span>
          </div>
          <div>{{ msg.messageText }}</div>
        </div>
        <div *ngIf="!messages.length" class="py-4 text-center text-slate-400">No messages yet. Say hello!</div>
      </div>
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Message</mat-label>
          <textarea matInput rows="5" formControlName="content"></textarea>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button type="button" (click)="expanded = false">Close</button>
      <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting" (click)="submit()">
        {{ isSubmitting ? 'Sending...' : 'Send' }}
      </button>
    </mat-card-actions>
  </mat-card>

  <button mat-fab extended color="accent" type="button" (click)="toggle()">
    <mat-icon>chat</mat-icon>
    Need help?
  </button>
</div>
